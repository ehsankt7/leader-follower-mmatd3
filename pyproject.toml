[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leader-follower-mmatd3"
version = "1.0.0"
description = "Code accompanying Deep reinforcement learning-based safe path planning for leader-follower robots"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23,<2.0",
  "torch==2.0.1",
  "tensorboard>=2.12",
  "squaternion>=0.3.2",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
leader_follower_mmatd3 = ["assets/*.launch"]
